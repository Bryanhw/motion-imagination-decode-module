# 演示配置 · 模型缺失/未训练：不加载任何判别模型，系统恒 idle，不发随机指令
# 机制：classifier.kind=untrained（均匀概率 0.5/0.5）→ 低于 min_confidence 0.6 → 恒 idle
# 验证：python -m bci_decoder.cli run --config configs/demo_nomodel.yaml --chunks 10
#   → 首条即 idle，链路不崩、全程无 left/right

source:
  kind: mock
  sfreq: 250.0
  ch_names: [C3, Cz, C4, CP3, CP4, P3, P4, Oz]
  chunk_samples: 25
  realtime: false
  seed: 0

preprocess:
  l_freq: 8.0
  h_freq: 30.0
  notch_freq: 50.0
  notch_q: 30.0
  filter_order: 4
  car: true
  artifact_ptp_uv: 200.0

features:
  kind: bandpower
  bands: {mu: [8.0, 13.0], beta: [13.0, 30.0]}

classifier:
  kind: untrained
  classes: [left, right]

postprocess:
  vote_window: 3
  ema_alpha: 0.4
  min_confidence: 0.6
  idle_label: idle

window:
  window_seconds: 2.0
  step_seconds: 0.5

output:
  sinks: [console]
  ws_host: "127.0.0.1"
  ws_port: 8765
