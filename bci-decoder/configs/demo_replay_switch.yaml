# 演示配置 · 规律切换：回放 4 秒左右交替的样本，验证「回放跟得上类别切换」
# 样本即 sample_continuous.npy（与旧 sample_switch.npy 哈希相同，统一用可重建的 continuous）：
# 前置：python scripts/make_sample_data.py --out data/sample_continuous.npy --seconds 60 --label-period 4
# 验证：python -m bci_decoder.cli run --config configs/demo_replay_switch.yaml --chunks 240
#   → 台面 label 应呈 左/右/左/右 规律切换（切换边缘可能有短暂过渡）

source:
  kind: replay
  sfreq: 250.0
  ch_names: [C3, Cz, C4, CP3, CP4, P3, P4, Oz]
  path: "data/sample_continuous.npy"
  chunk_samples: 25
  realtime: false
  speed: 1.0
  loop: false

preprocess:
  l_freq: 8.0
  h_freq: 30.0
  notch_freq: 50.0
  notch_q: 30.0
  filter_order: 4
  car: true
  artifact_ptp_uv: 200.0

features:
  kind: csp
  csp_components: 4
  csp_reg: 1e-4
  model_path: "artifacts/demo_csp.joblib"

classifier:
  kind: lda
  classes: [left, right]
  model_path: "artifacts/demo_lda.joblib"

postprocess:
  vote_window: 3
  ema_alpha: 0.4
  min_confidence: 0.6
  idle_label: idle

window:
  window_seconds: 2.0
  step_seconds: 0.5

output:
  sinks: [console]
  ws_host: "127.0.0.1"
  ws_port: 8765
