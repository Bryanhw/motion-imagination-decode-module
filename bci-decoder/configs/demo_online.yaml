# 在线解码演示配置：加载 bootstrap_demo 训练出的模型，用 mock 源验证闭环
# 用法：python -m bci_decoder.cli run --config configs/demo_online.yaml --chunks 200

source:
  kind: mock
  sfreq: 250.0
  ch_names: [C3, Cz, C4, CP3, CP4, P3, P4, Oz]
  chunk_samples: 25
  realtime: false
  seed: 0

preprocess:
  l_freq: 8.0
  h_freq: 30.0
  notch_freq: 50.0
  notch_q: 30.0
  filter_order: 4
  car: true
  artifact_ptp_uv: 200.0

features:
  kind: csp
  csp_components: 4
  csp_reg: 1e-4
  model_path: "artifacts/demo_csp.joblib"

classifier:
  kind: lda
  classes: [left, right]
  model_path: "artifacts/demo_lda.joblib"

postprocess:
  vote_window: 3
  ema_alpha: 0.4
  min_confidence: 0.6
  idle_label: idle

window:
  window_seconds: 2.0
  step_seconds: 0.5

output:
  sinks: [console]
  ws_host: "127.0.0.1"
  ws_port: 8765
