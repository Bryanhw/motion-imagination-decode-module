# 演示配置 · 弱信号（实验配置）：低信噪比输入→域外检测→idle
# 改进（2026-10-21，D2 提案落地）：启用域内检测 OOD。CSP 的 log-variance 归一化抹掉绝对
#    功率，LDA 对分布外样本武断给出近 0/1 高置信，min_confidence 挡不住单类虚高（旧缺陷 2c）。
#    OOD 在“特征→分类”之间判定：马氏距离（结构性异常）+ 信号强度下限（弱信号/近零输入），
#    任一命中即喂均匀概率给稳定器→输出 idle；9 字段契约零改动。
#    详见 docs/evidence/W9_1027/2c_改进提案/D2_20261021_2c_OOD域内检测实施细化_阎浩文.md
#    ⚠️ ood.enabled=true 需先训练出 ood.joblib：python scripts/bootstrap_demo.py --config configs/demo_weak.yaml
#    若模型缺失将优雅降级为不启用（见 core._build_ood），并在控制台打印告警。
# 前置：data/sample_weak.npy（低 SNR 合成样本，工程自检用，不评价算法性能）
#   python scripts/make_sample_data.py --out data/sample_weak.npy --seconds 60 --label-period 4 --snr-db -6
# 验证：python -m bci_decoder.cli run --config configs/demo_weak.yaml --chunks 200
#   → 目标：台面 label 全程 idle（OOD 域外判定命中）

source:
  kind: replay
  sfreq: 250.0
  ch_names: [C3, Cz, C4, CP3, CP4, P3, P4, Oz]
  path: "data/sample_weak.npy"
  chunk_samples: 25
  realtime: false
  speed: 1.0
  loop: false

preprocess:
  l_freq: 8.0
  h_freq: 30.0
  notch_freq: 50.0
  notch_q: 30.0
  filter_order: 4
  car: true
  artifact_ptp_uv: 200.0

features:
  kind: csp
  csp_components: 4
  csp_reg: 1e-4
  model_path: "artifacts/demo_csp.joblib"

classifier:
  kind: lda
  classes: [left, right]
  model_path: "artifacts/demo_lda.joblib"

postprocess:
  vote_window: 3
  ema_alpha: 0.4
  min_confidence: 0.6
  idle_label: idle

# 域内检测（2c 缺陷改进，D2 提案落地；本配置灰度开启，默认全局关）
ood:
  enabled: true
  method: mahalanobis
  chi2_quantile: 0.99
  score_scale: 1.0
  strength_floor_enabled: true
  model_path: "artifacts/ood.joblib"

window:
  window_seconds: 2.0
  step_seconds: 0.5

output:
  sinks: [console]
  ws_host: "127.0.0.1"
  ws_port: 8765
