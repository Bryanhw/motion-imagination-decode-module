# 在线运动想象解码模块 · 默认配置
# 所有可调参数集中在此，交付企业时只需改这一个文件。

source:
  kind: mock            # mock(合成自检) | replay(离线回放) | lsl(真实设备)
  sfreq: 250.0
  ch_names: [C3, Cz, C4, CP3, CP4, P3, P4, Oz]
  chunk_samples: 25     # 250Hz * 0.1s
  realtime: true
  seed: 0
  path: ""              # replay 时填写 .npy 路径
  speed: 1.0
  loop: false
  stream_name: "BCI-EEG"  # lsl 时的流名称
  resolve_timeout: 5.0

preprocess:
  l_freq: 8.0           # 运动想象关注 mu/beta 节律
  h_freq: 30.0
  notch_freq: 50.0      # 中国工频
  notch_q: 30.0
  filter_order: 4
  car: true             # 共平均参考
  artifact_ptp_uv: 200.0

features:
  kind: csp             # csp(当前路线) | bandpower(旧默认) | covariance(备用)
  bands:
    mu: [8.0, 13.0]
    beta: [13.0, 30.0]
  covariance_shrinkage: 0.1
  csp_components: 4      # 空间滤波器个数（2 对）→ 特征维数 = csp_components
  csp_reg: 1e-4          # 平均协方差收缩正则
  model_path: "artifacts/demo_csp.joblib"   # 训练好的 CSP 模型（含空间滤波矩阵 W）

classifier:
  kind: lda             # lda | onnx | untrained
  classes: [left, right]
  model_path: "artifacts/demo_lda.joblib"   # 训练好的 .joblib 路径
  onnx_path: ""

postprocess:
  vote_window: 3        # 连续 3 次一致才切换，抑制抖动
  ema_alpha: 0.4
  min_confidence: 0.6
  idle_label: idle

window:
  window_seconds: 2.0   # 滑窗长度：是端到端延迟的主要成分
  step_seconds: 0.25    # 决策步长

output:
  sinks: [console, jsonl]
  record_path: "artifacts/decoder_output.jsonl"
  ws_host: "127.0.0.1"
  ws_port: 8765
